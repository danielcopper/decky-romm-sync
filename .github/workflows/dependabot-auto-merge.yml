name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# GITHUB_TOKEN needs only pull-requests:write to enable auto-merge. The lock push
# uses a separately-minted, contents:write-scoped App token (see below), so the
# default token stays read-only on contents.
permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ---- pip path ------------------------------------------------------
      # Dependabot bumps the version RANGE in requirements-*.txt but never
      # regenerates the pinned requirements-*.lock that CI installs from, so the
      # lock-sync gate (part of the required `lint` check) fails on every pip PR
      # until the lock is recompiled. We recompile it here and push it back.
      #
      # Security (defense in depth, all of):
      #   - the job is gated to `github.actor == 'dependabot[bot]'`, which only
      #     ever bumps already-declared deps (no third party can trigger it);
      #   - the compile runs `--only-binary :all:`, so NO package code executes
      #     (wheels are static metadata) — nothing can plant a hook for the later
      #     push step;
      #   - checkout uses `persist-credentials: false` and the contents:write App
      #     token is minted ONLY AFTER the compile, so no write credential is on
      #     disk/in env during the (non-executing) resolve.
      # The push must be authored by the App, not GITHUB_TOKEN, because
      # GITHUB_TOKEN pushes don't re-trigger CI (anti-recursion) — see release.yml.
      - name: Check out the PR branch (no persisted credentials)
        if: steps.meta.outputs.package-ecosystem == 'pip'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: steps.meta.outputs.package-ecosystem == 'pip'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        if: steps.meta.outputs.package-ecosystem == 'pip'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.10.2"

      # Auto-merge is safe only while the bump stays UNDER the `<X` ceiling the
      # maintainer already declared (e.g. pytest-asyncio held <1.4 for #806). If
      # Dependabot raises a ceiling, that PR needs human review. The ceiling lives
      # only in requirements-*.txt; this gate reads it (no duplicated cap list).
      # The repo is public, so the unauthenticated base fetch needs no token.
      - name: Check the bump stays under the declared version ceilings
        id: cap
        if: steps.meta.outputs.package-ecosystem == 'pip'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_REF"
          tmp="$(mktemp -d)"
          git show "origin/${BASE_REF}:requirements-dev.txt" > "$tmp/dev.txt"
          git show "origin/${BASE_REF}:requirements-docs.txt" > "$tmp/docs.txt"
          if python scripts/check_dependabot_cap.py \
               "$tmp/dev.txt" requirements-dev.txt \
               "$tmp/docs.txt" requirements-docs.txt; then
            echo "within_cap=true" >> "$GITHUB_OUTPUT"
          else
            echo "within_cap=false" >> "$GITHUB_OUTPUT"
          fi

      # `--only-binary :all:` forbids building sdists, so resolving the
      # PR-controlled requirements executes NO package code (wheels carry static
      # metadata) — there is nothing to plant a git hook or tamper with the
      # workspace before the later token-bearing push. Verified to resolve
      # identically to a plain compile for this dep set.
      - name: Regenerate dependency locks
        id: locks
        if: steps.meta.outputs.package-ecosystem == 'pip'
        run: |
          set -euo pipefail
          uv pip compile --only-binary :all: requirements-dev.txt -o requirements-dev.lock
          uv pip compile --only-binary :all: requirements-docs.txt -o requirements-docs.lock
          if git diff --quiet -- requirements-dev.lock requirements-docs.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint App token for the lock push
        id: app-token
        if: steps.meta.outputs.package-ecosystem == 'pip' && steps.locks.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push regenerated locks
        if: steps.meta.outputs.package-ecosystem == 'pip' && steps.locks.outputs.changed == 'true'
        env:
          # Via env, never interpolated into the shell (Actions hardening): a
          # crafted dependency name or branch can't inject commands, and the
          # App token (a masked secret) can't be logged via the push URL.
          TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.lock requirements-docs.lock
          git commit -m "chore(deps): regenerate dependency locks for ${DEP_NAMES}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"

      # Enable auto-merge. For pip, gate on the cap check (in-range bump only);
      # a ceiling raise is left for human review. Nothing installed from pip ships
      # in the plugin (runtime deps are vendored) and auto-merge completes only
      # when every required check passes, so CI is the gate for in-range bumps —
      # no reliance on update-type, which fetch-metadata reports unreliably for
      # range bumps. npm and github-actions keep the patch/minor gate.
      - name: Enable auto-merge
        if: |
          (steps.meta.outputs.package-ecosystem == 'pip' && steps.cap.outputs.within_cap == 'true') ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
